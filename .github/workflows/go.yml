name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.2'

    # The Linux packages that Cogent Core needs (as installed by `core setup`),
    # cached across runs: installing them from the apt mirrors can take many minutes.
    - name: Install Core dependencies
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: gcc libgl1-mesa-dev libegl1-mesa-dev mesa-vulkan-drivers xorg-dev libwayland-dev libxkbcommon-dev
        version: 1.0

    # the core command, and the Go tools that it installs (goimports, goalimports, goalls)
    - name: Install Core
      run: go install cogentcore.org/core@main && core update

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -short -v ./... -coverprofile cover.out -timeout 2m

    - name: Update coverage report
      uses: cogentcore/goal-coverage-report@v0
      with:
        coverage-file: cover.out
      if: github.event_name == 'push'
